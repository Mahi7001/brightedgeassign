replicaCount: 1

image:
  repository: 986293906729.dkr.ecr.ap-south-1.amazonaws.com/data-sync
  pullPolicy: IfNotPresent
  tag: "v1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
podAnnotations: {}

config:
  appEnv: "dev"
  redisHost: "redis-master.data-sync.svc.cluster.local"
  redisPort: "6379"
  logLevel: "INFO"
  workers: "2"
  maxConnections: "50"

secrets:
  redisPassword: ""

externalSecret:
  enabled: true
  secretStoreName: aws-secretsmanager
  secretStoreKind: ClusterSecretStore
  remoteSecretKey: data-sync/redis

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true
  releaseLabel: "kube-prometheus-stack"
  interval: "30s"

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-sync-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/Mahi7001/brightedgeassign.git
    targetRevision: brightedge
    path: part1/standard/datasync/production
  destination:
    server: https://kubernetes.default.svc
    namespace: data-sync-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true